version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devscope_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devscope
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: devscope_dashboard
    environment:
      - DEVSCOPE_DB_TYPE=postgresql
      - DEVSCOPE_POSTGRES_URI=postgresql://postgres:postgres@postgres:5432/devscope
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m etl.pipeline &&
             python database/load_data.py &&
             streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501"
